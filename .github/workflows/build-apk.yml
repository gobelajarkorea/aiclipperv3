name: Build AutoClipper AI v3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AutoClipper AI v3
        run: |
          echo "=== FILES ==="
          ls -la

          ZIP=$(find . -maxdepth 1 -type f -name "AutoClipperAI_v3_source.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: AutoClipperAI_v3_source.zip tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "=== PROJECT ==="
          ls -la project

      - name: Check Android project
        run: |
          echo "=== SETTINGS ==="
          cat project/settings.gradle

          echo "=== APP ==="
          ls -la project/app

          echo "=== BUILD GRADLE ==="
          cat project/app/build.gradle

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK FOUND ==="
          find project/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClipperAI-v3-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
