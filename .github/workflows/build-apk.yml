name: Build AutoClipper AI v3

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Tampilkan struktur project
      - name: Check project
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== BUILD FILE ==="
          cat app/build.gradle

      # 5. Build APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      # 6. Cari APK
      - name: Find APK
        run: |
          echo "=== APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClipperAI-v3-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
